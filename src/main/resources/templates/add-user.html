<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Add User</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Add New User</h1>

<form th:action="@{/admin/users/save}" th:object="${user}" method="post">

    <div>
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}">
        <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}">
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>

    <div>
        <label>Password:</label>
        <input type="password" th:field="*{password}">
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <div>
        <label>Phone:</label>
        <input type="text" th:field="*{phone}">
    </div>

    <div>
        <label>Role:</label>
        <select th:field="*{role}">
            <option value="">--Select Role--</option>
            <option value="MEMBER">Member</option>
            <option value="COACH">Coach</option>
            <option value="ADMIN">Admin</option>
            <option value="OWNER">Owner</option>
        </select>
        <div th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
    </div>

    <div>
        <label>Active:</label>
        <input type="checkbox" th:field="*{active}">
    </div>

    <div>
        <button type="submit">Save User</button>
    </div>
</form>

<div class="page-actions">
    <a th:href="@{/admin/users}">Back to Users List</a>

    <a th:href="@{/owner/dashboard}" sec:authorize="hasRole('OWNER')">
        Back to Owner Dashboard
    </a>
</div>

</body>
</html>
