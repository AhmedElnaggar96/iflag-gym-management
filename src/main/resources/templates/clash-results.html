<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>All Clash Results</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>All Clash Results</h1>

<div class="page-links">
    <a th:href="@{/admin/clash-results/add}">Add Clash Result</a>
</div>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Clash Event</th>
        <th>Member</th>
        <th>Pull Ups</th>
        <th>Dips</th>
        <th>Push Ups</th>
        <th>Squats</th>
        <th>Sit Ups</th>
        <th>Notes</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="result : ${clashResults}">
        <td th:text="${result.id}"></td>
        <td th:text="${result.clashEvent.title}"></td>
        <td th:text="${result.member.user.fullName}"></td>
        <td th:text="${result.pullUps}"></td>
        <td th:text="${result.dips}"></td>
        <td th:text="${result.pushUps}"></td>
        <td th:text="${result.squats}"></td>
        <td th:text="${result.sitUps}"></td>
        <td th:text="${result.notes}"></td>
        <td>
            <a th:href="@{/admin/clash-results/edit(id=${result.id})}">Edit</a>
            <a th:href="@{/admin/clash-results/delete(id=${result.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<div class="page-actions">
    <a th:href="@{/admin/dashboard}">Back to Admin Dashboard</a>

    <a th:href="@{/owner/dashboard}" sec:authorize="hasRole('OWNER')">
        Back to Owner Dashboard
    </a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>

</body>
</html>
