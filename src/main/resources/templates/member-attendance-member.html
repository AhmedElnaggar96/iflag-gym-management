<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Attendance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1 th:text="'Attendance History - ' + ${memberProfile.user.fullName}"></h1>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Coach</th>
        <th>Session Date</th>
        <th>Session Type</th>
        <th>Status</th>
        <th>Notes</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="attendance : ${attendanceList}">
        <td th:text="${attendance.id}"></td>
        <td th:text="${attendance.coach != null ? attendance.coach.user.fullName : 'No Coach'}"></td>
        <td th:text="${attendance.sessionDate}"></td>
        <td th:text="${attendance.sessionType}"></td>
        <td th:text="${attendance.status}"></td>
        <td th:text="${attendance.notes}"></td>
    </tr>
    </tbody>
</table>

<div class="page-actions">
    <a th:href="@{/member/dashboard}">Back to Member Dashboard</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>

</body>
</html>
