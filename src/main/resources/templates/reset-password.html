<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Reset Password</h1>

<p>
    Reset password for:
    <strong th:text="${user.fullName}"></strong>
</p>

<p th:if="${passwordError}" th:text="${passwordError}"></p>

<form th:action="@{/admin/users/reset-password}" method="post">

    <input type="hidden" name="id" th:value="${user.id}">

    <div>
        <label>New Password:</label>
        <input type="password" name="newPassword">
    </div>

    <div>
        <label>Confirm Password:</label>
        <input type="password" name="confirmPassword">
    </div>

    <div>
        <button type="submit">Reset Password</button>
    </div>

</form>

<div class="page-actions">
    <a th:href="@{/admin/users}">Back to Users</a>

    <a th:href="@{/owner/dashboard}" sec:authorize="hasRole('OWNER')">
        Back to Owner Dashboard
    </a>
</div>

</body>
</html>
